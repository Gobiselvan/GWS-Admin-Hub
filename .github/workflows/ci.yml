name: Code checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Apps Script JavaScript syntax
        run: |
          for file in Code.gs Workflow.gs LicenseSnapshot.gs; do
            cp "$file" /tmp/gws-code-syntax.js
            node --check /tmp/gws-code-syntax.js
          done
          node --check tests/test.js
      - name: Run offline validation and guard tests
        run: node tests/test.js
      - name: Validate Apps Script manifest JSON
        run: node -e "const f = require('./appsscript.json'); if (!f.dependencies?.enabledAdvancedServices?.length) process.exit(1)"
